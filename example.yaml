# maxmilo Mitsubishi HVAC ESPHome Template
# Copy this file to your own config (e.g., my-ac.yaml) and customize.

substitutions:
  name: mon-hvac
  friendly_name: "Ma Climatisation"
  climate_id: ma_clim_id
  
  # Set the UART pins for ESP-01 (TX=GPIO1, RX=GPIO3)
  tx_pin: TX
  rx_pin: RX
  
  # Optional: Home Assistant sensor for remote temperature
  # remote_temp_sensor: "sensor.living_room_temp"

packages:
  core: !include common/core.yaml
  wifi: !include common/wifi.yaml
  mitsubishi: !include common/mitsubishi.yaml

esphome:
  name: ${name}

esp8266:
  board: esp01_1m

# Override default logger to use UART1 (GPIO2) for logging
# This keeps UART0 (TX/RX) free for the HVAC communication.
logger:
  hardware_uart: UART1
  level: INFO
